<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ноуцензор</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101110;color:#f5f6f1}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:28px 20px 170px}h1{font-size:32px;margin:8px 0 4px;letter-spacing:-.03em}h2{font-size:22px;margin:30px 0 16px}p,.sub{color:#aeb5ac}button,input{font:inherit}button{color:inherit;cursor:pointer}header{display:flex;justify-content:space-between;align-items:center}.mark{font-size:13px;letter-spacing:.13em;color:#c4ed82;font-weight:700}.icon{border:0;background:#292d28;border-radius:50%;width:42px;height:42px;font-size:23px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 16px}.tile{border:0;background:none;padding:0;text-align:left;min-width:0}.cover{aspect-ratio:1;border-radius:12px;display:flex;align-items:flex-end;padding:16px;color:#102013;font-size:30px;font-weight:800;background:linear-gradient(145deg,#c7ed77,#40b896)}.tile:nth-child(3n+2) .cover{background:linear-gradient(145deg,#d6c5ff,#9072dc)}.tile:nth-child(3n) .cover{background:linear-gradient(145deg,#ffc994,#eb827e)}.name{display:block;font-weight:700;margin-top:9px;overflow-wrap:anywhere}.small{font-size:13px;color:#aeb5ac;margin-top:4px}.bar{display:flex;gap:8px;margin:20px 0}.bar input{width:100%;background:#242824;border:1px solid #424941;border-radius:10px;padding:12px;color:white}.track{display:flex;align-items:center;gap:12px;border-bottom:1px solid #30352f;padding:12px 0}.track button{border:0;background:none;padding:0}.track .play{width:42px;height:42px;flex:none;border-radius:9px;background:#383f37;font-size:20px}.track .title{flex:1;text-align:left;overflow-wrap:anywhere}.track .add{font-size:24px;color:#c4ed82;width:34px}.back{background:none;border:0;padding:0;color:#c4ed82;font-size:16px}.empty{line-height:1.5}.player{position:fixed;bottom:0;left:0;right:0;background:#222722;padding:12px 18px max(16px,env(safe-area-inset-bottom));border-top:1px solid #414a40}.player-inner{max-width:520px;margin:auto}.player-row{display:flex;align-items:center;gap:12px}.player-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}.player button{background:none;border:0;font-size:25px}.player audio{width:100%;height:35px;margin-top:8px}dialog{background:#252b25;color:white;border:1px solid #576255;border-radius:14px;width:min(90vw,400px);padding:22px}dialog::backdrop{background:#000a}dialog input{width:100%;padding:12px;background:#111;border:1px solid #606b5e;border-radius:8px;color:white}dialog button{background:#c4ed82;color:#13200e;border:0;border-radius:8px;padding:10px 16px;margin-top:14px}dialog .cancel{background:transparent;color:white}
</style><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body><main><header><span class="mark">НОУЦЕНЗОР / МУЗЫКА</span><button class="icon" id="home" aria-label="Библиотека">⌂</button></header><div id="app"></div></main><div class="player"><div class="player-inner"><div class="player-row"><button id="prev" aria-label="Предыдущий">⏮</button><div class="player-title" id="playing">Выбери трек</div><button id="next" aria-label="Следующий">⏭</button></div><audio id="audio" controls preload="metadata"></audio></div></div><dialog id="dialog"><form method="dialog"><h2 id="dialog-title">Новый плейлист</h2><div id="dialog-body"></div><button value="cancel" class="cancel">Отмена</button><button value="ok">Сохранить</button></form></dialog><script>
const auth=window.Telegram?.WebApp?.initData||''; window.Telegram?.WebApp?.ready(); let tracks=[],playlists={},queue=[],current=-1,view='home';const app=document.querySelector('#app'),audio=document.querySelector('#audio'),dialog=document.querySelector('#dialog');const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){if(!navigator.onLine){alert('Для изменения плейлиста нужно подключение к интернету.');return}fetch('/api/playlists?auth='+encodeURIComponent(auth),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(playlists)}).then(r=>{if(!r.ok)throw Error()}).catch(()=>alert('Не удалось сохранить плейлист. Проверь соединение.'))}function label(n){if(n.startsWith('sc:')){try{let x=JSON.parse(n.slice(3));return x.artist+' — '+x.title}catch{return 'Трек SoundCloud'}}return n.replace(/\.(mp3|m4a)$/i,'')}async function play(list,i){queue=list;current=i;let n=queue[current];let saved=await offlineGet(n).catch(()=>null);if(saved){audio.src=URL.createObjectURL(saved);document.querySelector('#playing').textContent=label(n);audio.play().catch(()=>{});return}if(!navigator.onLine){alert('Этот трек ещё не сохранён на устройстве.');return}audio.src=n.startsWith('sc:')?'/stream?url='+encodeURIComponent(JSON.parse(n.slice(3)).url)+'&auth='+encodeURIComponent(auth):'/audio?name='+encodeURIComponent(n)+'&auth='+encodeURIComponent(auth);document.querySelector('#playing').textContent=label(queue[current]);audio.play().catch(()=>{});}document.querySelector('#next').onclick=()=>{if(current+1<queue.length)play(queue,current+1)};document.querySelector('#prev').onclick=()=>{if(current>0)play(queue,current-1)};audio.onended=()=>document.querySelector('#next').click();document.querySelector('#home').onclick=home;
function home(){view='home';app.innerHTML='<h1>Моя музыка</h1><p>Твоя коллекция и плейлисты</p><h2>Библиотека</h2><div class="grid" id="tiles"></div>';let tiles=document.querySelector('#tiles');tile('Поиск SoundCloud','Искать музыку','⌕',searchSoundCloud);tile('Скачанные','Доступны без сети','↓',async()=>list('Скачанные',await offlineList()));tile('Все треки',tracks.length+' треков','♫',()=>list('Все треки',tracks));for(const [n,t] of Object.entries(playlists))tile(n,t.length+' треков','♪',()=>list(n,t));tile('Создать плейлист','Новая подборка','+',create);function tile(name,sub,sym,fn){let b=document.createElement('button');b.className='tile';b.innerHTML='<div class="cover">'+sym+'</div><span class="name">'+esc(name)+'</span><span class="small">'+esc(sub)+'</span>';b.onclick=fn;tiles.append(b)}}
function searchSoundCloud(){app.innerHTML='<button class="back" id="back">← Библиотека</button><h1>Поиск музыки</h1><p>SoundCloud</p><div class="bar"><input id="query" placeholder="Исполнитель или трек"><button id="go">Найти</button></div><div id="results"></div>';document.querySelector('#back').onclick=home;document.querySelector('#go').onclick=async()=>{let q=document.querySelector('#query').value.trim();if(!q)return;let out=document.querySelector('#results');out.textContent='Ищем…';try{let r=await fetch('/api/search?auth='+encodeURIComponent(auth)+'&q='+encodeURIComponent(q));if(!r.ok)throw Error();let data=await r.json();let items=data.map(x=>'sc:'+JSON.stringify(x));out.innerHTML='';if(!items.length){out.textContent='Ничего не найдено';return}items.forEach((n,i)=>{let row=document.createElement('div');row.className='track';let x=data[i];row.innerHTML='<button class="play">▶</button><button class="title">'+esc(label(n))+(x.duration&&x.duration<=30?' (возможно фрагмент)':'')+'</button><button class="add" aria-label="Добавить в плейлист">＋</button>';row.querySelector('.play').onclick=row.querySelector('.title').onclick=()=>play(items,i);row.querySelector('.add').onclick=()=>add(n);out.append(row)})}catch{out.textContent='Поиск недоступен. Попробуй позже.'}}}function create(){if(!navigator.onLine){alert('Для создания плейлиста нужно подключение к интернету.');return}document.querySelector('#dialog-title').textContent='Новый плейлист';document.querySelector('#dialog-body').innerHTML='<input id="new-name" maxlength="80" placeholder="Название плейлиста" autofocus>';dialog.showModal();dialog.onclose=()=>{if(dialog.returnValue!=='ok')return;let n=document.querySelector('#new-name').value.trim();if(!n)return;if(Object.hasOwn(playlists,n)){alert('Плейлист с таким названием уже есть');return}playlists[n]=[];save();home()}}
function add(name){if(!navigator.onLine){alert('Для изменения плейлиста нужно подключение к интернету.');return}let names=Object.keys(playlists);if(!names.length){alert('Сначала создай плейлист в библиотеке');return}document.querySelector('#dialog-title').textContent='Добавить в плейлист';document.querySelector('#dialog-body').innerHTML=names.map((n,i)=>'<label style="display:block;padding:8px 0"><input style="width:auto" type="radio" name="p" value="'+i+'" '+(!i?'checked':'')+'> '+esc(n)+'</label>').join('');dialog.showModal();dialog.onclose=()=>{if(dialog.returnValue!=='ok')return;let p=names[Number(document.querySelector('[name=p]:checked').value)];if(!playlists[p].includes(name))playlists[p].push(name);save()}}
function list(name,items){view=name;app.innerHTML='<button class="back" id="back">← Библиотека</button><h1>'+esc(name)+'</h1><p>'+items.length+' треков</p><div class="bar"><input id="search" placeholder="Поиск по названию" aria-label="Поиск по названию"></div><div id="tracks"></div>';document.querySelector('#back').onclick=home;const search=document.querySelector('#search');function render(){let out=document.querySelector('#tracks');out.innerHTML='';let found=items.filter(n=>n.toLowerCase().includes(search.value.toLowerCase()));if(!found.length){out.innerHTML='<p class="empty">Треков пока нет. Добавь их из раздела «Все треки».</p>';return}found.forEach(n=>{let row=document.createElement('div');row.className='track';row.innerHTML='<button class="play" aria-label="Воспроизвести">▶</button><button class="title">'+esc(label(n))+'</button><button class="add" aria-label="Сохранить на устройство">↓</button><button class="add" aria-label="Добавить в плейлист">＋</button>';row.querySelector('.play').onclick=row.querySelector('.title').onclick=()=>play(found,found.indexOf(n));row.querySelectorAll('.add')[0].onclick=()=>offlineSave(n);row.querySelectorAll('.add')[1].onclick=()=>add(n);out.append(row)})}search.oninput=render;render()}

function offlineDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open('nocensor-offline',1);q.onupgradeneeded=()=>q.result.createObjectStore('tracks');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function offlineGet(key){const db=await offlineDB();return new Promise((resolve,reject)=>{const tx=db.transaction('tracks');const q=tx.objectStore('tracks').get(key);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);tx.oncomplete=()=>db.close()})}
async function offlineList(){const db=await offlineDB();return new Promise((resolve,reject)=>{const tx=db.transaction('tracks');const q=tx.objectStore('tracks').getAllKeys();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);tx.oncomplete=()=>db.close()})}
async function offlineSave(n){if(n.startsWith('sc:')){alert('Сохранение записей SoundCloud пока не подключено.');return}try{let r=await fetch('/audio?name='+encodeURIComponent(n)+'&auth='+encodeURIComponent(auth));if(!r.ok)throw Error('HTTP '+r.status);let b=await r.blob();let expected=Number(r.headers.get('content-length'));if(!b.size||(expected&&b.size!==expected))throw Error('файл загрузился не полностью');const db=await offlineDB();await new Promise((resolve,reject)=>{const tx=db.transaction('tracks','readwrite');tx.objectStore('tracks').put(b,n);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});db.close();alert('Трек сохранён на этом устройстве.')}catch(e){alert('Не удалось сохранить трек: '+e.message)}}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
Promise.all(['/api/tracks','/api/playlists'].map(p=>fetch(p+'?auth='+encodeURIComponent(auth)).then(r=>{if(!r.ok)throw Error();return r.json()}))).then(([data,saved])=>{tracks=data;playlists=saved;try{localStorage.setItem('nocensor-snapshot',JSON.stringify({tracks,playlists}))}catch{}home()}).catch(()=>{try{let snapshot=JSON.parse(localStorage.getItem('nocensor-snapshot')||'{}');tracks=Array.isArray(snapshot.tracks)?snapshot.tracks:[];playlists=snapshot.playlists||{};home()}catch{app.textContent='Не удалось открыть библиотеку.'}});
</script></body></html>
